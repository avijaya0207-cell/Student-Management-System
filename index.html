<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f5fb;
    color: #222;
}

header {
    background: #4338ca;
    color: white;
    padding: 25px 7%;
}

header h1 {
    font-size: 28px;
    margin-bottom: 6px;
}

header p {
    color: #ddd;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 30px auto;
}

.login-card {
    background: white;
    max-width: 420px;
    margin: 60px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.login-card h2 {
    margin-bottom: 20px;
    color: #4338ca;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    margin-bottom: 14px;
}

input:focus {
    border-color: #4338ca;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 10px;
}

.login-btn, .submit-btn {
    background: #4338ca;
    color: white;
}

.logout-btn {
    background: #fee2e2;
    color: #b91c1c;
    float: right;
    margin-top: -5px;
}

.cancel-btn {
    background: #ddd;
    color: #333;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
    margin-bottom: 25px;
}

.stat-card, .form-card, .table-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.stat-card h3 {
    color: #666;
    font-size: 15px;
}

.stat-card h2 {
    color: #4338ca;
    margin-top: 12px;
    font-size: 30px;
}

.form-card {
    margin-bottom: 25px;
}

.form-card h2, .table-card h2 {
    margin-bottom: 20px;
    color: #333;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.edit-btn {
    background: #e0e7ff;
    color: #3730a3;
    margin-right: 5px;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
}

.search-box {
    margin-bottom: 18px;
    max-width: 350px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

th {
    background: #f5f5ff;
    color: #4338ca;
}

.table-wrapper {
    overflow-x: auto;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #777;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}

#message {
    color: #b91c1c;
    margin-top: 12px;
    font-size: 14px;
}

@media(max-width: 600px) {
    header {
        padding: 22px 5%;
    }

    header h1 {
        font-size: 23px;
    }

    .container {
        width: 94%;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-card, .table-card {
        padding: 16px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 Student Management System</h1>
    <p>Manage student records easily</p>
</header>

<!-- Admin Login -->
<div class="container" id="loginSection">

    <div class="login-card">
        <h2>Admin Login</h2>

        <form id="loginForm">
            <input
                type="email"
                id="loginEmail"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <p id="message"></p>
    </div>

</div>

<!-- Student Dashboard -->
<div class="container" id="dashboard" style="display:none;">

    <button class="logout-btn" id="logoutBtn">
        Logout
    </button>

    <div style="clear:both;"></div>

    <div class="stats">
        <div class="stat-card">
            <h3>Total Students</h3>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat-card">
            <h3>System Status</h3>
            <h2 style="font-size:20px;">Active</h2>
        </div>
    </div>

    <div class="form-card">

        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <input type="text" id="name"
                    placeholder="Student Name" required>

                <input type="text" id="roll"
                    placeholder="Roll Number" required>

                <input type="text" id="department"
                    placeholder="Department" required>

                <input type="email" id="email"
                    placeholder="Email Address" required>

                <input type="tel" id="phone"
                    placeholder="Phone Number" required>

            </div>

            <button type="submit" class="submit-btn" id="saveBtn">
                Add Student
            </button>

            <button type="button" class="cancel-btn"
                id="cancelBtn" style="display:none;">
                Cancel
            </button>

        </form>

    </div>

    <div class="table-card">

        <h2>Student Records</h2>

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="🔍 Search students..."
        >

        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>

            </table>

        </div>

        <p id="emptyMessage" class="empty">
            No students added yet.
        </p>

    </div>

</div>

<footer>
    Student Management System | Full Stack Development Project
</footer>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

// Firebase Configuration

const firebaseConfig = {
    apiKey: "AIzaSyCqidVCJ-OMavibexigP7AMt1r7DDH5TbU",
    authDomain: "student-management-syste-d09fa.firebaseapp.com",
    projectId: "student-management-syste-d09fa",
    storageBucket: "student-management-syste-d09fa.firebasestorage.app",
    messagingSenderId: "108666366252",
    appId: "1:108666366252:web:4ef2da7baeba9fddda6489",
    measurementId: "G-X4CS3GB1NC"
};

// Initialize Firebase

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const studentCollection = collection(db, "students");

let students = [];
let editId = null;
let unsubscribeStudents = null;

const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const studentForm = document.getElementById("studentForm");

// Admin Login

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("message");

    message.textContent = "Logging in...";

    try {

        await signInWithEmailAndPassword(auth, email, password);

        message.textContent = "";

        loginForm.reset();

    } catch (error) {

        console.error(error);

        message.textContent = "Login failed. Check your email and password.";

    }

});

// Authentication Status

onAuthStateChanged(auth, (user) => {

    if (user) {

        loginSection.style.display = "none";
        dashboard.style.display = "block";

        loadStudents();

    } else {

        loginSection.style.display = "block";
        dashboard.style.display = "none";

        if (unsubscribeStudents) {
            unsubscribeStudents();
            unsubscribeStudents = null;
        }

        students = [];

    }

});

// Load Students from Firestore

function loadStudents() {

    if (unsubscribeStudents) {
        unsubscribeStudents();
    }

    unsubscribeStudents = onSnapshot(
        studentCollection,

        (snapshot) => {

            students = snapshot.docs.map(document => ({
                id: document.id,
                ...document.data()
            }));

            displayStudents();

        },

        (error) => {

            console.error(error);

            alert("Unable to load students. Check Firestore Rules.");

        }
    );

}

// Display Students

function displayStudents(data = students) {

    const list = document.getElementById("studentList");

    const emptyMessage = document.getElementById("emptyMessage");

    list.innerHTML = "";

    document.getElementById("totalStudents").textContent =
        students.length;

    emptyMessage.style.display =
        data.length === 0 ? "block" : "none";

    data.forEach((student) => {

        const row = document.createElement("tr");

        [
            student.name,
            student.roll,
            student.department,
            student.email,
            student.phone
        ].forEach(value => {

            const cell = document.createElement("td");

            cell.textContent = value || "";

            row.appendChild(cell);

        });

        const actions = document.createElement("td");

        const editButton = document.createElement("button");

        editButton.textContent = "Edit";
        editButton.className = "edit-btn";

        editButton.onclick = () => editStudent(student.id);

        const deleteButton = document.createElement("button");

        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-btn";

        deleteButton.onclick = () => deleteStudent(student.id);

        actions.appendChild(editButton);
        actions.appendChild(deleteButton);

        row.appendChild(actions);

        list.appendChild(row);

    });

}

// Add or Update Student

studentForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const student = {

        name: document.getElementById("name").value.trim(),

        roll: document.getElementById("roll").value.trim(),

        department: document.getElementById("department").value.trim(),

        email: document.getElementById("email").value.trim(),

        phone: document.getElementById("phone").value.trim()

    };

    const duplicate = students.some(item =>

        item.roll.toLowerCase() === student.roll.toLowerCase() &&
        item.id !== editId

    );

    if (duplicate) {

        alert("This Roll Number already exists!");

        return;

    }

    try {

        if (editId === null) {

            await addDoc(studentCollection, student);

            alert("Student added successfully!");

        } else {

            await updateDoc(
                doc(db, "students", editId),
                student
            );

            alert("Student updated successfully!");

        }

        resetForm();

    } catch (error) {

        console.error(error);

        alert("Error saving student. Check Firestore Rules.");

    }

});

// Edit Student

function editStudent(id) {

    const student = students.find(item => item.id === id);

    if (!student) return;

    document.getElementById("name").value = student.name || "";

    document.getElementById("roll").value = student.roll || "";

    document.getElementById("department").value =
        student.department || "";

    document.getElementById("email").value = student.email || "";

    document.getElementById("phone").value = student.phone || "";

    editId = id;

    document.getElementById("formTitle").textContent = "Edit Student";

    document.getElementById("saveBtn").textContent = "Update Student";

    document.getElementById("cancelBtn").style.display = "inline-block";

    window.scrollTo({ top: 0, behavior: "smooth" });

}

// Delete Student

async function deleteStudent(id) {

    if (confirm("Are you sure you want to delete this student?")) {

        try {

            await deleteDoc(doc(db, "students", id));

            alert("Student deleted successfully!");

        } catch (error) {

            console.error(error);

            alert("Error deleting student. Check Firestore Rules.");

        }

    }

}

// Reset Form

function resetForm() {

    studentForm.reset();

    editId = null;

    document.getElementById("formTitle").textContent =
        "Add New Student";

    document.getElementById("saveBtn").textContent =
        "Add Student";

    document.getElementById("cancelBtn").style.display = "none";

}

document.getElementById("cancelBtn").addEventListener(
    "click",
    resetForm
);

// Search Students

document.getElementById("search").addEventListener("input", function() {

    const value = this.value.toLowerCase();

    const filtered = students.filter(student =>

        (student.name || "").toLowerCase().includes(value) ||

        (student.roll || "").toLowerCase().includes(value) ||

        (student.department || "").toLowerCase().includes(value)

    );

    displayStudents(filtered);

});

// Logout

document.getElementById("logoutBtn").addEventListener("click", async () => {

    try {

        await signOut(auth);

        alert("Logged out successfully!");

    } catch (error) {

        console.error(error);

        alert("Unable to logout.");

    }

});

</script>

</body>
    </html>
